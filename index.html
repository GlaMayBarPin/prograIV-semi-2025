<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantApp - Tu asistente personal de jardinería</title>
    <style>
        :root {
            --color-light-green: #A3B18A;
            --color-cream: #F6EEC9;
            --color-brown: #7F5539;
            --color-pale-ivory: #FAF3E0;
            --color-gray: #6C757D;
            --color-mint: #D4E2C3;
            --color-off-white: #FAF8EF;
            --color-light-brown: #A57D5D;
            --color-white: #FFFCF5;
            --color-light-gray: #A0A7B0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--color-pale-ivory);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 430px;
            position: relative;
        }

        /* Estilos compartidos entre login y registro */
        .form-container {
            background-color: var(--color-white);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .logo-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo-container {
            background-color: var(--color-mint);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title {
            text-align: center;
            padding: 10px 0;
        }

        .title h1 {
            color: var(--color-light-green);
            font-size: 28px;
            margin-bottom: 5px;
        }

        .title p {
            color: var(--color-gray);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--color-brown);
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--color-cream);
            border-radius: 8px;
            background-color: var(--color-off-white);
            font-size: 14px;
            color: var(--color-gray);
        }

        .password-input {
            position: relative;
        }

        .password-input .form-input {
            padding-right: 40px;
        }

        .eye-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-gray);
            cursor: pointer;
        }

        .info-message {
            background-color: var(--color-mint);
            color: var(--color-light-green);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--color-light-green);
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .alt-link {
            text-align: center;
            color: var(--color-gray);
            font-size: 14px;
            display: block;
            margin-bottom: 20px;
        }

        .alt-link a {
            color: var(--color-light-green);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        /* Estilos específicos para pantalla de login */
        .login-options {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            margin: 20px 0;
        }

        .login-btn {
            background-color: var(--color-light-green);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
            margin-right: 10px;
            text-align: center;
        }

        .signup-btn {
            background-color: var(--color-cream);
            color: var(--color-light-green);
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
            margin-left: 10px;
            text-align: center;
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
            color: var(--color-light-green);
            font-size: 14px;
            text-decoration: none;
            display: block;
        }

        /* Botones de navegación activos/inactivos */
        .btn:disabled {
            background-color: var(--color-light-gray);
            cursor: not-allowed;
        }

        /* Controles de visibilidad */
        #login-container, #signup-container {
            display: none;
        }

        #login-container.active, #signup-container.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Formulario de Inicio de Sesión -->
        <div id="login-container" class="form-container active">
            <div class="logo-section">
                <div class="logo-container">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L8 6H10V14C10 15.1 10.9 16 12 16C13.1 16 14 15.1 14 14V6H16L12 2Z" fill="#388E3C"/>
                        <path d="M4 20H20C20 18.9 19.1 18 18 18H6C4.9 18 4 18.9 4 20Z" fill="#388E3C"/>
                    </svg>
                </div>
                <div class="logo-container">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 3C4.9 3 4 3.9 4 5V10C4 11.1 4.9 12 6 12H18C19.1 12 20 11.1 20 10V5C20 3.9 19.1 3 18 3H6Z" fill="#7CB342"/>
                        <path d="M16 13H8C6.9 13 6 13.9 6 15V19C6 20.1 6.9 21 8 21H16C17.1 21 18 20.1 18 19V15C18 13.9 17.1 13 16 13Z" fill="#CDDC39"/>
                    </svg>
                </div>
            </div>

            <div class="title">
                <h1>PlantApp</h1>
                <p>Tu asistente personal de jardinería</p>
            </div>

            <div class="login-options">
                <button class="login-btn" onclick="showLogin()">Iniciar sesión</button>
                <button class="signup-btn" onclick="showSignup()">Crear cuenta</button>
            </div>

            <form class="login-form" style="padding: 0 40px 20px;">
                <div class="form-group">
                    <input type="email" class="form-input" placeholder="Correo electrónico" required>
                </div>
                <div class="form-group password-input">
                    <input type="password" class="form-input" placeholder="Contraseña" required>
                    <span class="eye-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z" fill="#6C757D"/>
                        </svg>
                    </span>
                </div>
                <button type="submit" class="btn">Iniciar sesión</button>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </form>
        </div>

        <!-- Formulario de Registro -->
        <div id="signup-container" class="form-container">
            <div class="logo-section">
                <div class="logo-container">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L8 6H10V14C10 15.1 10.9 16 12 16C13.1 16 14 15.1 14 14V6H16L12 2Z" fill="#388E3C"/>
                        <path d="M4 20H20C20 18.9 19.1 18 18 18H6C4.9 18 4 18.9 4 20Z" fill="#388E3C"/>
                    </svg>
                </div>
                <div class="logo-container">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 3C4.9 3 4 3.9 4 5V10C4 11.1 4.9 12 6 12H18C19.1 12 20 11.1 20 10V5C20 3.9 19.1 3 18 3H6Z" fill="#7CB342"/>
                        <path d="M16 13H8C6.9 13 6 13.9 6 15V19C6 20.1 6.9 21 8 21H16C17.1 21 18 20.1 18 19V15C18 13.9 17.1 13 16 13Z" fill="#CDDC39"/>
                    </svg>
                </div>
            </div>

            <div class="title">
                <h1>Crear cuenta</h1>
                <p>Comienza a recibir recomendaciones para tu jardín</p>
            </div>

            <form class="signup-form" style="padding: 0 40px 20px;">
                <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-input" placeholder="Tu nombre" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-input" placeholder="correo@ejemplo.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <div class="password-input">
                        <input type="password" class="form-input" placeholder="********" required>
                        <span class="eye-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z" fill="#6C757D"/>
                            </svg>
                        </span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Código postal / País</label>
                    <input type="text" class="form-input" placeholder="Tu código postal o país" required>
                </div>
                
                <div class="info-message">
                    Puedes personalizar más tus recomendaciones después
                </div>
                
                <button type="submit" class="btn">Registrarme</button>
                
                <div class="alt-link">
                    ¿Ya tienes cuenta? <a onclick="showLogin()">Inicia sesión</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Funciones para cambiar entre los formularios
        function showLogin() {
            document.getElementById('login-container').classList.add('active');
            document.getElementById('signup-container').classList.remove('active');
        }
        
        function showSignup() {
            document.getElementById('login-container').classList.remove('active');
            document.getElementById('signup-container').classList.add('active');
        }

        // Manejar la visibilidad de las contraseñas
        const eyeIcons = document.querySelectorAll('.eye-icon');
        eyeIcons.forEach(icon => {
            icon.addEventListener('click', function() {
                const passwordInput = this.previousElementSibling;
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    this.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 7C9.24 7 7 9.24 7 12C7 14.76 9.24 17 12 17C14.76 17 17 14.76 17 12C17 9.24 14.76 7 12 7ZM12 15C10.34 15 9 13.66 9 12C9 10.34 10.34 9 12 9C13.66 9 15 10.34 15 12C15 13.66 13.66 15 12 15Z" fill="#6C757D"/>
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17.5C9.24 17.5 7 15.26 7 12.5C7 9.74 9.24 7.5 12 7.5C14.76 7.5 17 9.74 17 12.5C17 15.26 14.76 17.5 12 17.5Z" fill="#6C757D"/>
                        <line x1="4" y1="4" x2="20" y2="20" stroke="#6C757D" stroke-width="2"/>
                    </svg>`;
                } else {
                    passwordInput.type = 'password';
                    this.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z" fill="#6C757D"/>
                    </svg>`;
                }
            });
        });

        // Prevenir el envío del formulario (para demo)
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(event) {
                event.preventDefault();
                alert('Formulario enviado (demo)');
            });
        });
    </script>
</body>
</html>
